<!-- Document Object Model -->
<!-- HTML을 컴퓨터가 이해하기 쉽게 나무 구조로 바꿔놓은 것 -->
<!-- 왜 필요함? 자바스크립트가 HTML을 직접 건드릴 수 있게 해주려고 -->
<!-- 
HTML = 원본 문서
DOM = 브라우저가 만든 구조
JS = DOM을 조작하는 도구 
-->
<!-- 요약: HTML을 트리구조로 바꾸는게 DOM 구조 -> DOM 구조를 조작하는 도구가 JS -> JS가 HTML을 직접 건드릴 수 있게 해준다. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 class = "hello">H1 Hello</h1>
    <div class="hello">Div Hello</div>
    <h1 class = "hi">H1 hi</h1>

    <a href="https://google.com">Visit Goole</a>
</body>
</html>
