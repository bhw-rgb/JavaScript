<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pomodoro Timer</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍅</text></svg>">
  <style>
    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .timer-card {
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      background: white;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      width: 320px;
    }

    .time-display {
      font-size: 3rem;
      font-weight: bold;
      margin: 20px 0;
    }

    input {
      text-align: center;
    }
  </style>
</head>
<body>

<div class="timer-card">
  <h4>🍅 Pomodoro Timer</h4>

  <!-- Display -->
  <div id="time" class="time-display">00:00:00</div>

  <!-- Time Inputs -->
  <div class="row g-2 mb-3">
    <div class="col">
      <input id="hours" type="number" min="0" class="form-control" placeholder="HH">
    </div>
    <div class="col">
      <input id="minutes" type="number" min="0" max="59" class="form-control" placeholder="MM">
    </div>
    <div class="col">
      <input id="seconds" type="number" min="0" max="59" class="form-control" placeholder="SS">
    </div>
  </div>

  <button class="btn btn-primary mb-3 w-100" onclick="setTime()">Set Time</button>

  <!-- Controls -->
  <div class="btn-group w-100">
    <button class="btn btn-success" onclick="startTimer()">Start</button>
    <button class="btn btn-warning" onclick="pauseTimer()">Pause</button>
    <button class="btn btn-danger" onclick="resetTimer()">Reset</button>
  </div>
</div>

<script src="pomodoro.js"></script>

</body>
</html>
